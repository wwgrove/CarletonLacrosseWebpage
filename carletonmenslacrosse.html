<!DOCTYPE html>
<html>
<head>
  <title>Carleton Men's Lacrosse Team</title>
  <style>
    /* Removes the default white border around the webpage */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* Prevents scrollbars on the main page */
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Makes the iframe fill the exact size of the window */
    .dynamic-iframe {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border: none;
      display: block;
    }

    /* Black footer bar so long pages aren't cut off by mobile browser nav bars */
    .site-footer {
      flex: 0 0 auto;
      background: #000;
      color: #444;
      text-align: center;
      font: 11px sans-serif;
      padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>

  <iframe 
    src="https://paint-hide-11728048.figma.site/" 
    class="dynamic-iframe"
    title="Carleton Men's Lacrosse Team">
  </iframe>

  <footer class="site-footer">Powered by GroveWare</footer>

</body>
</html>
